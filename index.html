<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIETA — controle de dieta, treino e emagrecimento</title>
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DIETA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0b1020;--bg2:#0f1629;--card:#141c31;--card2:#1a2440;--line:#263152;--txt:#eaf0fb;--mut:#93a0bd;
  --acc:#4ade80;--acc2:#22c55e;--acc-ink:#04210f;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--pink:#f472b6;--pur:#c084fc;
  --prot:#60a5fa;--carb:#fbbf24;--fat:#f472b6;--shadow:0 8px 30px rgba(0,0,0,.35);--r:18px;
}
[data-theme=light]{
  --bg:#f3f6fc;--bg2:#e9eef8;--card:#ffffff;--card2:#f1f5fc;--line:#dde4f1;--txt:#0f172a;--mut:#5a6785;
  --acc:#16a34a;--acc2:#15803d;--acc-ink:#ffffff;--warn:#d97706;--bad:#dc2626;--blue:#2563eb;--pink:#db2777;--pur:#9333ea;
  --prot:#2563eb;--carb:#d97706;--fat:#db2777;--shadow:0 8px 24px rgba(30,50,100,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
small,.mut{color:var(--mut)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:800;font-size:1.25rem;letter-spacing:.5px}
.brand i{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#38bdf8);font-style:normal;font-size:1.2rem}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--mut);cursor:pointer;text-align:left;font-weight:600;width:100%}
.nav:hover{background:var(--card2);color:var(--txt)}
.nav.on{background:var(--card);color:var(--txt);box-shadow:inset 3px 0 0 var(--acc)}
.nav span.i{width:22px;text-align:center}
main{padding:22px clamp(14px,3vw,34px) 90px;max-width:1200px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(135deg,#0f3d2c,#134e4a 45%,#1e3a8a);border:0;color:#f0fdf4}
[data-theme=light] .card.hero{background:linear-gradient(135deg,#16a34a,#0d9488 50%,#2563eb)}
.hero .mut,.hero small{color:#d1fae5}
.card h3 .sub{font-weight:500;color:var(--mut);font-size:.85rem;margin-left:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:10px}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.8rem;color:var(--mut);cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
input[type=range]{padding:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tabs .chip{padding:7px 14px;font-size:.9rem;white-space:nowrap}
.big{font-size:2.3rem;font-weight:800;line-height:1}
.mid{font-size:1.4rem;font-weight:800}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.pill.g{background:rgba(74,222,128,.15);color:var(--acc);border-color:transparent}
.pill.w{background:rgba(251,191,36,.15);color:var(--warn);border-color:transparent}
.pill.r{background:rgba(248,113,113,.15);color:var(--bad);border-color:transparent}
.bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.macro{display:grid;grid-template-columns:90px 1fr 100px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.macro b{font-weight:700}
.macro .r{text-align:right;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right}
.meal{padding:0;overflow:hidden}
.meal .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card2);gap:10px}
.entry{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.entry:hover{background:var(--card2)}
.entry .nm{font-weight:600}
.entry .mt{color:var(--mut);font-size:.82rem}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.summary div{background:var(--card2);padding:10px 6px;border-radius:12px}
.summary b{display:block;font-size:1.3rem}
.summary small{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.ring{position:relative;width:170px;height:170px;margin:auto}
.ring svg{transform:rotate(-90deg)}
.ring .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:12px}
.empty{padding:24px;text-align:center;color:var(--mut)}
.quote{font-size:1.15rem;font-weight:600;line-height:1.45}
.story{display:block;text-decoration:none;color:inherit}
.story h4{margin:6px 0 4px}
.badge{display:grid;place-items:center;text-align:center;gap:4px;padding:14px 8px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.badge .em{font-size:2rem;filter:grayscale(1) opacity(.35)}
.badge.on{border-color:var(--acc)}
.badge.on .em{filter:none}
.badge small{line-height:1.2}
.modal{position:fixed;inset:0;background:rgba(2,6,16,.7);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(640px,100%);box-shadow:var(--shadow)}
.modal .box.wide{width:min(900px,100%)}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.list .it{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:var(--card2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:10px 18px;border-radius:16px;width:max-content;max-width:90vw;text-align:center;font-weight:700;z-index:80;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.bottom{display:none}
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--card2);cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:.8rem}
.set{display:grid;grid-template-columns:30px 1fr 1fr 34px;gap:8px;align-items:center;margin:6px 0}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card2);margin-bottom:8px}
summary{cursor:pointer;font-weight:700}
.note{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:var(--txt);padding:10px 14px;border-radius:12px;font-size:.88rem}
.good{background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.35)}
.bad2{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35)}
.ins{display:flex;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card2);margin-bottom:8px}
.ins .em{font-size:1.5rem}
.ins.w{border-color:rgba(251,191,36,.45)} .ins.r{border-color:rgba(248,113,113,.45)} .ins.g{border-color:rgba(74,222,128,.45)}
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg2);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{flex:1;border:0;background:none;color:var(--mut);padding:6px 0;font-size:.68rem;display:grid;gap:2px;justify-items:center;cursor:pointer}
  .bottom button .i{font-size:1.25rem}
  .bottom button.on{color:var(--acc)}
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .summary{grid-template-columns:repeat(2,1fr)}
  .macro{grid-template-columns:70px 1fr 84px}
  h1{font-size:1.4rem}
  main{padding-top:14px}
}
@media print{.side,.bottom{display:none}}

.syncpill{position:fixed;top:8px;right:10px;z-index:40;font-size:.72rem;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);display:none;pointer-events:none;box-shadow:var(--shadow)}
.syncpill.on{display:block}.syncpill.ok{color:var(--acc)}.syncpill.warn{color:#f5b942}.syncpill.err{color:#ff6b6b}
@media(max-width:800px){.syncpill{top:6px;right:6px;font-size:.68rem}}

</style>
</head>

 {t:'Creatina monohidratada', b:'É o suplemento esportivo mais estudado. A dose usual é 3 a 5 g por dia, todos os dias, sem necessidade de "ciclar". Pode aumentar o peso na balança em 1 a 2 kg por retenção de água dentro do músculo; isso não é gordura. Quem tem doença renal deve falar com o médico antes.', s:'ISSN Position Stand: Creatine supplementation (2017).'},

 {t:'Platô: o que fazer', b:'Se a média do peso ficou estável por 2 a 3 semanas, revise: porções (balança!), registros de fim de semana, bebidas e passos. Depois, ajuste a meta calórica ou o gasto em pequenos passos (100 a 200 kcal), em vez de cortes drásticos.', s:'Prática clínica de nutrição.'},

/* ================= SUGESTÕES / INSIGHTS ================= */
function lastDays(n, end = TODAY()) { return Array.from({length: n}, (_, i) => addDays(end, -(n - 1 - i))); }
function insights() {
  const out = [], t = targets(), days = lastDays(7).filter(hasLog);
  const push = (lvl, em, title, text) => out.push({lvl, em, title, text});
  if (!S.weights.length) push('w', '⚖️', 'Registre seu peso', 'Sem pesagens ainda. Pese-se em jejum e registre em Corpo → Peso.');
  if (!days.length) { push('w', '🍽️', 'Comece o diário', 'Registre suas refeições de hoje para eu poder analisar sua semana.'); }
  else {
    const avg = {k: 0, p: 0, fb: 0}; days.forEach(d => { const x = dayTot(d); avg.k += x.k; avg.p += x.p; avg.fb += x.fb; }); for (const k in avg) avg[k] /= days.length;
    const bd = sum(days, budget) / days.length;
    if (avg.k > bd * 1.1) push('r', '🔥', 'Calorias acima da meta', `Média de ${fmt(avg.k)} kcal/dia nos últimos ${days.length} dias registrados, ${fmt(avg.k - bd)} kcal acima do orçamento (${fmt(bd)}). Revise porções de carboidratos e gorduras (azeite, pasta de amendoim, queijos).`);
    else if (avg.k < bd * 0.75) push('w', '⚠️', 'Muito abaixo da meta', `Média de ${fmt(avg.k)} kcal/dia, bem abaixo de ${fmt(bd)}. Comer pouco demais pode derrubar o treino e provocar compulsão. Tente chegar mais perto da meta.`);
    else push('g', '✅', 'Calorias no alvo', `Média de ${fmt(avg.k)} kcal/dia, dentro do orçamento de ${fmt(bd)}. Siga assim.`);
    if (avg.p < t.p * 0.85) push('w', '🥩', 'Proteína abaixo da meta', `Você está em ${fmt(avg.p)} g/dia e a meta é ${fmt(t.p)} g. Inclua uma fonte de proteína em cada refeição (ovos, frango, peixe, iogurte proteico, whey).`);
    else push('g', '💪', 'Proteína em dia', `${fmt(avg.p)} g/dia, perto da meta de ${fmt(t.p)} g.`);
    if (avg.fb < t.fb * 0.6) push('w', '🥦', 'Poucas fibras', `Média de ${fmt(avg.fb)} g/dia (meta ~${fmt(t.fb)} g). Mais feijão, aveia, frutas e verduras aumentam saciedade.`);
  }
  const wl = lastDays(7).map(d => (S.log[d] || {}).water || 0).filter(x => x > 0);
  if (wl.length && sum(wl) / wl.length < t.water * 0.7) push('w', '💧', 'Água abaixo do ideal', `Você bebeu em média ${fmt(sum(wl) / wl.length)} ml nos dias registrados; a meta é ~${fmt(t.water)} ml.`);
  const wk = weekStart(TODAY()); const exWeek = S.exercises.filter(e => e.d >= wk);
  const mins = sum(exWeek, e => e.min), strength = exWeek.filter(e => ['musc', 'hiit'].includes(e.type)).length;
  if (mins < 150 && diffDays(TODAY(), wk) >= 3) push('w', '🏃', 'Atividade da semana', `${fmt(mins)} min nesta semana. A recomendação da OMS é 150 min/semana de atividade moderada. Uma caminhada de 30–40 min já ajuda.`);
  else if (mins >= 150) push('g', '🏅', 'Meta de atividade batida', `${fmt(mins)} min nesta semana. Excelente.`);
  if (strength < 2 && diffDays(TODAY(), wk) >= 4) push('w', '🏋️', 'Treino de força', 'Faça pelo menos 2 treinos de força por semana para proteger a massa magra durante o déficit.');
  const sl = lastDays(7).map(d => (S.log[d] || {}).sleep).filter(Boolean);
  if (sl.length >= 3 && sum(sl, s => s.h) / sl.length < 7) push('w', '😴', 'Sono curto', `Média de ${fmt(sum(sl, s => s.h) / sl.length, 1)} h. Dormir pouco aumenta a fome e dificulta perder gordura. Mire em 7–9 h.`);
  const ws = sortedWeights();
  if (ws.length && diffDays(TODAY(), ws[ws.length - 1].d) > 7) push('w', '⚖️', 'Hora de pesar', `Sua última pesagem foi em ${dmyFull(ws[ws.length - 1].d)}. Pese-se 1–3x por semana, sempre em jejum.`);
  const tr = trend();
  if (tr != null) {
    const pct = tr / curWeight() * 100;
    if (pct < -1.0) push('w', '🐇', 'Perda rápida demais', `Ritmo de ${fmt(Math.abs(tr), 2)} kg/semana (${fmt(Math.abs(pct), 1)}% do peso). Acima de ~1%/semana aumenta o risco de perder músculo. Considere subir um pouco as calorias.`);
    else if (tr > -0.1 && ws.length >= 4) push('w', '🧱', 'Peso estagnado', 'Sua tendência está estável. Revise porções, fins de semana e passos antes de cortar mais calorias.');
    else push('g', '📉', 'Tendência de queda saudável', `Ritmo de ${fmt(Math.abs(tr), 2)} kg/semana nas últimas semanas. Continue.`);
  }
  if (t.bmi >= 30) push('w', '🦵', 'Proteja as articulações', 'Com IMC acima de 30, prefira caminhada (inclusive inclinada), bicicleta e elíptico no início; introduza corrida de forma gradual.');
  return out;
}
function nowSuggestions(meal) {
  const d = TODAY(), t = targets(), tot = dayTot(d);
  const remK = budget(d) - tot.k, remP = t.p - tot.p;
  const list = COMBOS.map(([n, items]) => { const m = T0(); items.forEach(([fn, g]) => { const f = foodByName(fn); if (f) addT(m, mac(f, g)); }); return {n, items, m}; });
  return {remK, remP, list: list.filter(x => x.m.k <= Math.max(150, remK)).sort((a, b) => (b.m.p / Math.max(1, b.m.k)) - (a.m.p / Math.max(1, a.m.k))).slice(0, 6)};
}

/* ---------- DIETAS / CARDÁPIO ---------- */
function dietTot(diet) {
  const t = T0(); for (const m in diet.meals) diet.meals[m].forEach(it => { const f = foodById(it.fid); if (f) addT(t, mac(f, it.g)); }); return t;
}
function mealItemsTot(items) { const t = T0(); items.forEach(it => { const f = foodById(it.fid); if (f) addT(t, mac(f, it.g)); }); return t; }
let GEN = null;
function genDiet(variant) {
  const t = targets(), items = [], pick = {};
  for (const slot in SLOTS) {
    const opts = SLOTS[slot];
    const i = variant === 'rand' ? Math.floor(Math.random() * opts.length) : ((variant && variant[slot] != null) ? variant[slot] : 0);
    pick[slot] = i;
    opts[i].forEach(([n, g, r]) => { const f = foodByName(n); if (f) items.push({slot, f, base: g, g, r}); });
  }
  for (let it = 0; it < 6; it++) {
    const pI = items.filter(x => x.r === 'P'), oth = items.filter(x => x.r !== 'P');
    const pOth = sum(oth, x => mac(x.f, x.g).p), pBase = sum(pI, x => mac(x.f, x.base).p) || 1;
    const sp = clamp((t.p - pOth) / pBase, .5, 2.2); pI.forEach(x => x.g = x.base * sp);
    const fixedK = sum(items.filter(x => x.r === 'P' || x.r === 'V'), x => mac(x.f, x.g).k);
    const cf = items.filter(x => x.r === 'C' || x.r === 'F'), cfBase = sum(cf, x => mac(x.f, x.base).k) || 1;
    const sc = clamp((t.kcal - fixedK) / cfBase, .4, 2.6); cf.forEach(x => x.g = x.base * sc);
  }
  const meals = {};
  items.forEach(x => { const step = x.g < 20 ? 1 : 5; const g = Math.max(step, Math.round(x.g / step) * step); (meals[x.slot] = meals[x.slot] || []).push({fid: x.f.id, g}); });
  return {meals, pick};
}
function dietCard(diet, extra) {
  const t = dietTot(diet), tg = targets();
  const meals = MEALS.filter(m => (diet.meals[m[0]] || []).length).map(([k, n, em]) => `<div style="margin-top:8px"><b>${em} ${n}</b> <small class="mut">(${fmt(mealItemsTot(diet.meals[k]).k)} kcal)</small>${diet.meals[k].map(it => { const f = foodById(it.fid); return f ? `<div class="kv"><span>${esc(f.n)}</span><span class="mut">${fmt(it.g)} g</span></div>` : ''; }).join('')}</div>`).join('');
  return `<div class="card c6"><div class="row between"><h3>${esc(diet.name)}</h3>${extra || ''}</div>
   <div class="row" style="margin:6px 0"><span class="pill g">${fmt(t.k)} kcal</span><span class="pill">P ${fmt(t.p)} g</span><span class="pill">C ${fmt(t.c)} g</span><span class="pill">G ${fmt(t.f)} g</span><span class="pill ${Math.abs(t.k - tg.kcal) < 120 ? 'g' : 'w'}">meta ${fmt(tg.kcal)}</span></div>${meals}</div>`;
}
function recipeTot(r) { const t = T0(); r.ing.forEach(([n, g]) => { const f = foodByName(n); if (f) addT(t, mac(f, g)); }); return t; }
function shopList(days) {
  const map = {};
  days.forEach(d => { const id = S.plan[parseISO(d).getDay()]; const diet = S.diets.find(x => x.id === id); if (!diet) return; for (const m in diet.meals) diet.meals[m].forEach(it => { map[it.fid] = (map[it.fid] || 0) + it.g; }); });
  return Object.entries(map).map(([fid, g]) => ({fid, g, f: foodById(fid)})).filter(x => x.f).sort((a, b) => a.f.n.localeCompare(b.f.n));
}

const ACHV = [

  ['ex10', '💪', '10 atividades', 'Registre 10 atividades', () => S.exercises.length >= 10],
  ['km50', '🏃', '50 km', 'Some 50 km de caminhada/corrida', () => sum(S.exercises.filter(e => ['caminhada', 'corrida', 'esteira'].includes(e.type)), e => e.km) >= 50],

  ['diet', '📋', 'Planejador', 'Salve uma dieta', () => S.diets.length >= 1],
];
function bestStreak() { const ds = Object.keys(S.log).filter(hasLog).sort(); let best = 0, cur = 0, prev = null; ds.forEach(d => { cur = prev && diffDays(d, prev) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }); return best; }
function checkAch() {
  let n = 0; ACHV.forEach(([id, , name, , fn]) => { if (!S.achv[id] && fn()) { S.achv[id] = TODAY(); n++; toast('🏆 Conquista: ' + name); } });
  if (n) save();
}

/* ================= FOTOS (IndexedDB) ================= */
const IDB = {
  db: null,
  async open() { if (this.db) return this.db; return new Promise((res, rej) => { const r = indexedDB.open('dieta-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p', {keyPath: 'id'}); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async all() { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('p').objectStore('p').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async put(o) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('p', 'readwrite').objectStore('p').put(o); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
  async del(id) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('p', 'readwrite').objectStore('p').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
  async clear() { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('p', 'readwrite').objectStore('p').clear(); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
};
function resizeImage(file, max = 900) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.75)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function loadPhotos() {
  const box = $('#photos'); if (!box) return;
  try {
    const ps = (await IDB.all()).sort((a, b) => a.d < b.d ? 1 : -1);
    box.innerHTML = ps.length ? ps.map(p => `<div class="photo" data-act="viewPhoto" data-id="${p.id}"><img src="${p.data}" alt="Foto ${dmyFull(p.d)}"><span>${dmyFull(p.d)}${p.w ? ' · ' + fmt(p.w, 1) + ' kg' : ''}</span></div>`).join('') : '<div class="empty c12" style="grid-column:1/-1">Nenhuma foto ainda.</div>';
  } catch (e) { box.innerHTML = '<div class="empty" style="grid-column:1/-1">Este navegador não permite salvar fotos aqui.</div>'; }
}

function startSession(rid) {
  const r = S.routines.find(x => x.id === rid); if (!r) return;
  SESSION = {rid, name: r.name, start: Date.now(), items: r.items.map(it => { const last = lastLoad(it.ex); return {ex: it.ex, sets: Array.from({length: +it.sets || 3}, (_, i) => ({reps: (last && last[i] && last[i].reps) || (/^\d+$/.test(it.reps) ? it.reps : ''), load: (last && last[i] && last[i].load) || it.load || '', done: false})), target: it.reps}; })};
  renderSession();
}

function mealNow() { const h = new Date().getHours(); return h < 10 ? 'cafe' : h < 12 ? 'lanche1' : h < 15 ? 'almoco' : h < 18 ? 'lanche2' : h < 21 ? 'jantar' : 'ceia'; }
function cloneEntries(arr) { return arr.map(e => Object.assign({}, e, {id: uid()})); }
function applyDietTo(diet, d) {
  const L = dayEnsure(d); let n = 0;
  for (const m in diet.meals) diet.meals[m].forEach(it => { const f = foodById(it.fid); if (f) { (L.meals[m] = L.meals[m] || []).push(mk(f, it.g)); n++; } });
  save(); return n;
}

const SKEY = 'dieta.sync';

function syDebounce(ms = 4000) { clearTimeout(syTimer); syTimer = setTimeout(() => syncNow(), ms); }
function syStatus(st, extra) {

  if (!syOn()) { el.className = 'syncpill'; el.textContent = ''; return; }

  el.className = 'syncpill on ' + m[0]; el.textContent = m[1]; el.title = extra || SY.err || '';
}
async function syApi(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, Object.assign({}, opt, {headers: Object.assign({Authorization: 'Bearer ' + SY.token, Accept: 'application/vnd.github+json'}, opt.headers || {})}));
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function syFind() { // outro aparelho já criou? acha pelo nome
  const l = await syApi('/gists?per_page=100');
  const g = l.find(x => x.description === 'DIETA-sync' && x.files && x.files['dieta.json']);
  if (g) { SY.gist = g.id; sySave(); }
}
async function syRemote() {
  const g = await syApi('/gists/' + SY.gist), f = g.files && g.files['dieta.json']; if (!f) return null;
  let txt = f.content; if (f.truncated || txt == null) txt = await (await fetch(f.raw_url)).text();
  const j = JSON.parse(txt); return j && j.state ? j : null;
}
async function syPush() {
  if (!S.updated) S.updated = Date.now();
  const st = Object.assign({}, S); delete st.offCache;
  const content = JSON.stringify({app: 'dieta', v: 1, updated: S.updated, state: st});
  if (content.length > 4e6) throw new Error('dados grandes demais');
  const body = JSON.stringify({description: 'DIETA-sync', public: false, files: {'dieta.json': {content}}});
  if (!SY.gist) { const g = await syApi('/gists', {method: 'POST', body}); SY.gist = g.id; }
  else await syApi('/gists/' + SY.gist, {method: 'PATCH', body});
  SY.base = S.updated; SY.last = Date.now(); SY.err = ''; sySave();
}
function busyUI() { const m = $('#modal'), a = document.activeElement; return (m && m.classList.contains('on')) || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function syApply(state, upd) {
  const off = S.offCache; S = Object.assign(DEF(), state); S.profile = Object.assign(DEF().profile, state.profile || {}); S.rem = Object.assign(DEF().rem, state.rem || {}); S.offCache = off || {}; S.updated = upd;
  SY_CUR = syPayload(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  document.documentElement.dataset.theme = S.profile.theme; render();
}
/* mescla dois estados: listas com id são unidas, números/textos ficam com o lado mais recente */
function mg(a, b, bNew) {
  if (a === undefined || a === null) return b; if (b === undefined || b === null) return a;
  const isO = x => x && typeof x === 'object' && !Array.isArray(x);
  if (Array.isArray(a) && Array.isArray(b)) {
    const prim = x => x === null || typeof x !== 'object';
    if (a.every(prim) && b.every(prim)) return [...new Set(bNew ? [...b, ...a] : [...a, ...b])];
    const key = x => x && typeof x === 'object' ? (x.id !== undefined ? 'i:' + x.id : (x.d !== undefined && x.kg !== undefined) ? 'w:' + x.d : undefined) : undefined;
    if (![...a, ...b].every(x => key(x) !== undefined)) return bNew ? b : a;
    const [o, n] = bNew ? [a, b] : [b, a], map = new Map(o.map(x => [key(x), x]));
    n.forEach(x => { const k = key(x); map.set(k, map.has(k) ? mg(map.get(k), x, true) : x); });
    return [...map.values()];
  }
  if (isO(a) && isO(b)) { const r = {}; new Set([...Object.keys(a), ...Object.keys(b)]).forEach(k => { r[k] = mg(a[k], b[k], bNew); }); return r; }
  return bNew ? b : a;
}
async function syncNow(manual) {
  if (!syOn()) return;
  if (syBusy) { syAgain = true; return; }
  if (navigator.onLine === false) { syStatus('off'); return; }
  syBusy = true; syStatus('busy');
  try {
    if (!SY.gist) await syFind();
    const remote = SY.gist ? await syRemote() : null;
    const dirty = (S.updated || 0) > SY.base || (SY.base === 0 && S.profile.setup);
    if (!remote) await syPush();
    else {
      const rU = remote.updated || 0;
      if (rU === SY.base && SY.base !== 0) { if (dirty) await syPush(); }
      else if (busyUI()) { syStatus('wait'); setTimeout(() => syncNow(), 8000); return; }
      else if (!dirty) { syApply(remote.state, rU); SY.base = rU; }
      else { syApply(mg(remote.state, S, (S.updated || 0) >= rU), Date.now()); await syPush(); toast('Dados deste aparelho e da nuvem foram combinados'); }
    }
    SY.last = Date.now(); SY.err = ''; sySave(); syStatus('ok');
    if (manual) toast('Sincronizado ✓');
  } catch (e) {
    SY.err = e.status === 401 ? 'Chave do GitHub inválida ou expirada' : e.status === 403 || e.status === 429 ? 'GitHub limitou temporariamente; tentarei de novo' : e.message === 'Failed to fetch' ? 'Sem conexão com o GitHub' : e.message;
    sySave(); syStatus(navigator.onLine === false ? 'off' : 'err', SY.err);
    if (manual) toast(SY.err);
    if (e.status !== 401) syDebounce(60000);
  } finally { syBusy = false; if (syAgain) { syAgain = false; syDebounce(1500); } }
}

  },
  syNow: () => syncNow(true),
  syCopy: async () => { try { await navigator.clipboard.writeText(syLink()); toast('Link copiado. Abra no outro aparelho.'); } catch (e) { prompt('Copie este link e abra no outro aparelho:', syLink()); } },
  syOff: () => { if (!confirm('Desconectar a nuvem deste aparelho? Os dados daqui continuam salvos; a cópia na nuvem não é apagada.')) return; SY.token = ''; SY.gist = ''; SY.base = 0; SY.login = ''; sySave(); syStatus('none'); render(); },
});
async function syFromHash() { // aparelho novo abrindo o link mágico
  const m = location.hash.match(/^#sync=([A-Za-z0-9+/=]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let tk = '', g = ''; try { [tk, g] = atob(m[1]).split('|'); } catch (e) { return; }
  if (!tk || syOn()) return;
  const keep = {token: SY.token, gist: SY.gist}; SY.token = tk;
  try {
    const u = await syApi('/user');
    if (!confirm('Conectar este aparelho à sincronização da conta GitHub “' + u.login + '”?\nSeus dados serão salvos nessa conta. Só confirme se o link é seu.')) { SY.token = keep.token; return; }
    SY.login = u.login; SY.gist = g || ''; SY.base = 0; sySave(); toast('Aparelho conectado'); syncNow(true);
  } catch (e) { SY.token = keep.token; toast('Link de sincronização inválido'); }
}
function syStart() {
  syStatus(syOn() ? 'pend' : 'none');
  if (syOn()) syncNow();
  setInterval(() => { if (document.visibilityState === 'visible' && syOn() && !syBusy) syncNow(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!syOn()) return; if (document.visibilityState === 'hidden') { clearTimeout(syTimer); syncNow(); } else syncNow(); });
  window.addEventListener('online', () => syOn() && syncNow()); window.addEventListener('offline', () => syOn() && syStatus('off'));
}


/* ================= CONTEÚDO ATUALIZÁVEL (histórias, promoções) E NOVAS VERSÕES ================= */
const BUILD = 'd8a1b04b2c';
const CKEY = 'dieta.content';
function applyContent(c) {
  if (!c) return;
  const rep = (arr, n) => { if (Array.isArray(n) && n.length) arr.splice(0, arr.length, ...n); };
  rep(STORIES, c.stories); rep(PROMOS, c.promos); rep(QUOTES, c.quotes); rep(TIPS, c.tips);
  if (c.promosDate) PROMOS_DATE = c.promosDate;
}
async function updateContent() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const cur = JSON.parse(localStorage.getItem(CKEY) || 'null');
    if (cur) applyContent(cur);
    const r = await fetch('content.json', {cache: 'no-cache'}); if (!r.ok) return;
    const c = await r.json();
    if (c && c.updated && (!cur || c.updated > cur.updated)) { localStorage.setItem(CKEY, JSON.stringify(c)); applyContent(c); if (cur) { toast('Histórias e promoções atualizadas'); if (!busyUI()) render(); } }
  } catch (e) {}
}
async function checkVersion() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('version.json', {cache: 'no-store'}); if (!r.ok) return;
    const v = await r.json();
    if (v.build && v.build !== BUILD) { toast('Nova versão do site! Atualizando…'); setTimeout(() => { const go = () => busyUI() ? setTimeout(go, 4000) : location.reload(); go(); }, 1800); }
  } catch (e) {}
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ================= INIT ================= */
(function init() {
  document.documentElement.dataset.theme = S.profile.theme;
  if (/^https?:$/.test(location.protocol)) { try { applyContent(JSON.parse(localStorage.getItem(CKEY) || 'null')); } catch (e) {} }
  render();
  if (!S.profile.setup && !/^#sync=/.test(location.hash)) onboarding();
  syStart();
  syFromHash().then(() => { if (!S.profile.setup && !syOn()) onboarding(); });
  updateContent(); checkVersion();
  window.addEventListener('focus', () => { checkVersion(); updateContent(); });
})();

</script>
